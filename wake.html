<style>

:root{

<script>
(() => {
'use strict';

/* ---------- tokens from CSS ---------- */
const rootStyle = getComputedStyle(document.documentElement);
const cssv = n => rootStyle.getPropertyValue(n).trim();
const hexRGB = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };

const INK = hexRGB(cssv('--ink') || '#e6e3dc');
const SIG = hexRGB(cssv('--signal') || '#8ab8ff');

const MONO = cssv('--mono') || 'monospace';
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- math ---------- */
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, x) => a + (b - a) * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function hash(a, b) {

const Q = 'why is the sky blue?';
const QKEYS = [];
{ let tt = 10.2;
  for (let i = 0; i < Q.length; i++) {
    QKEYS.push(tt);

const T = { promptOn: 2.0, wakeGo: 8.0 };

T.tokenize = T.enter + 0.6;
T.ids = T.tokenize + 0.9;
T.embed = T.tokenize + 1.5;
T.absorb = T.embed + 3.0;
T.glide = T.absorb + 0.75;
T.glideEnd = T.glide + 2.8;
T.assemble = 21.0;
T.attend = 30.0;
T.consensus = 43.2;
T.answer = 44.8;
T.dissolve = 66.6;
T.settle = 68.0;
T.forget = 76.0;
T.home = 79.4;
const DUR = 81;
const RIPPLES = [T.wakeGo + 0.05, T.enter];
const FIELD_KF = [[0, 0], [3, .7], [8, .7], [10, 1], [T.glide, 1], [26, .55], [44, .5], [46, .38], [66, .38], [70, .85], [75, .8], [79.4, .16], [DUR, .13]];

/* ---------- the question as tokens ---------- */
const QT = [

  { s: 'is',   sp: 1, idx: 4,  id: 374,   node: 'is' },
  { s: 'the',  sp: 1, idx: 7,  id: 279,   node: 'the' },
  { s: 'sky',  sp: 1, idx: 11, id: 13180, node: 'sky' },
  { s: 'blue', sp: 1, idx: 15, id: 6437,  node: 'blue' },

/* ---------- association graph ---------- */
// id, label, kind, nx, ny, ring, relevant, dropOnNarrow
const NODE_DEFS = [
  ['why', 'why', 'hub', .13, .32, 0, 1],
  ['is', 'is', 'fn', .27, .46, 0, 1],
  ['the', 'the', 'fn', .27, .18, 0, 1],
  ['sky', 'sky', 'hub', .40, .34, 0, 1],
  ['blue', 'blue', 'hub', .66, .30, 0, 1],
  ['q', '?', 'fn', .03, .46, 0, 0],
  ['cause', 'cause', 'a', .03, .17, 1, 1],
  ['physics', 'physics', 'a', .11, .04, 2, 0, 1],
  ['ocean', 'ocean', 'a', .42, .05, 1, 0],
  ['blues', 'blues', 'a', .57, .09, 1, 0],
  ['sad', 'sad', 'a', .73, .03, 1, 0],
  ['azul', 'azul', 'a', .95, .07, 2, 0, 1],
  ['color', 'color', 'a', .84, .18, 1, 1],
  ['zh', '藍', 'a', .94, .31, 1, 0],
  ['bleu', 'bleu', 'a', .86, .45, 2, 0, 1],
  ['sunlight', 'sunlight', 'a', .52, .52, 1, 1],
  ['white', 'white light', 'a', .73, .59, 2, 1],
  ['spectrum', 'spectrum', 'a', .92, .64, 2, 1],
  ['cloud', 'cloud', 'a', .06, .63, 1, 0, 1],

  ['scatter', 'scatter', 'a', .45, .78, 3, 1],
  ['molecules', 'molecules', 'a', .27, .88, 2, 1],
  ['n2o2', 'N₂ O₂', 'a', .08, .93, 3, 1],
  ['lam', 'λ⁻⁴', 'a', .53, .96, 3, 1],

  ['violet', 'violet', 'a', .77, .96, 3, 1],

const EDGE_DEFS = [
  ['q', 'why'], ['why', 'sky'], ['why', 'blue'], ['the', 'sky'], ['is', 'sky'], ['is', 'blue'], ['sky', 'blue'],
  ['why', 'cause'], ['cause', 'physics'],
  ['blue', 'color'], ['blue', 'zh'], ['blue', 'bleu'], ['blue', 'azul'], ['blue', 'sad'], ['blue', 'blues'], ['sad', 'blues'],
  ['sky', 'ocean'], ['ocean', 'blue'], ['sky', 'cloud'], ['sky', 'air'], ['sky', 'atmosphere'], ['air', 'atmosphere'],
  ['air', 'molecules'], ['molecules', 'n2o2'], ['cloud', 'atmosphere'],
  ['sky', 'sunlight'], ['sunlight', 'white'], ['white', 'spectrum'], ['spectrum', 'wavelength'], ['wavelength', 'short'],
  ['wavelength', 'red'], ['short', 'lam'], ['lam', 'scatter'], ['scatter', 'rayleigh'], ['molecules', 'scatter'],
  ['short', 'violet'], ['violet', 'eye'], ['eye', 'blue'], ['color', 'spectrum'], ['physics', 'rayleigh'], ['scatter', 'air'],
];
// from, to, start, duration
const HOP_DEFS = [
  ['the', 'sky', 30.2], ['why', 'sky', 30.3], ['is', 'blue', 30.4],
  ['blue', 'color', 30.6], ['blue', 'zh', 30.7], ['blue', 'bleu', 30.78], ['blue', 'azul', 30.86],
  ['blue', 'sad', 31.6], ['blue', 'blues', 31.95],
  ['sky', 'ocean', 32.8, 0.7], ['sky', 'cloud', 33.3], ['ocean', 'blue', 33.9, 0.8],
  ['sky', 'air', 34.7], ['sky', 'atmosphere', 35.0], ['air', 'molecules', 35.3], ['why', 'cause', 35.6],
  ['molecules', 'n2o2', 35.9], ['cause', 'physics', 36.2],
  ['sky', 'sunlight', 36.4], ['sunlight', 'white', 37.0], ['white', 'spectrum', 37.6], ['spectrum', 'wavelength', 38.2],
  ['wavelength', 'short', 38.8], ['wavelength', 'red', 39.3], ['short', 'lam', 39.4],
  ['lam', 'scatter', 40.0], ['molecules', 'scatter', 40.0], ['scatter', 'rayleigh', 40.6], ['physics', 'rayleigh', 40.9, 0.8],
  ['short', 'violet', 41.2], ['violet', 'eye', 41.8], ['color', 'spectrum', 42.0, 0.7], ['eye', 'blue', 42.4, 0.6],
];
const REJECT = { sad: 32.5, blues: 32.85, ocean: 34.9 };

/* ---------- the answer ---------- */
// chosen text, candidates [text, p, ...], attending nodes, index of the sampled candidate
const ANS_DEFS = [
  ['sunlight', ['sunlight', .62, 'light', .21, 'the', .09], ['sunlight', 'sky']],
  [' scatters', [' scatters', .71, ' bounces', .14, ' hits', .08], ['scatter', 'rayleigh']],
  [' off', [' off', .55, ' in', .31], ['scatter', 'air']],
  [' the', null, ['the']],
  [' air', [' air', .66, ' atmosphere', .27], ['air', 'molecules', 'atmosphere']],
  ['.', null, []],
  [' short', [' short', .48, ' blue', .31, ' shorter', .12], ['short', 'wavelength']],
  [' blue', [' blue', .81, ' violet', .09], ['blue', 'color', 'violet']],
  [' waves', [' waves', .58, ' light', .33], ['wavelength', 'spectrum']],
  [' scatter', null, ['scatter', 'lam']],
  [' most', [' most', .83, ' more', .11], ['lam', 'short']],
  [',', null, []],
  [' so', [' so', .77, ' which', .15], ['why', 'cause']],
  [' blue', [' blue', .92, ' it', .04], ['blue', 'eye']],
  [' reaches', [' reaches', .44, ' comes', .29, ' fills', .18], ['eye', 'sunlight']],
  [' you', null, ['eye']],
  [' from', null, ['sky']],
  [' every', [' every', .67, ' all', .22], ['scatter', 'air']],
  [' part', [' direction', .41, ' part', .38, ' corner', .12], ['sky'], 1],
  [' of', null, []],
  [' the', null, ['the']],
  [' sky', null, ['sky']],
  ['.', null, ['q']],
];

/* ---------- build static scene ---------- */
const nodes = NODE_DEFS.map((d, i) => ({
  i, id: d[0], label: d[1], kind: d[2], nx: d[3], ny: d[4], ring: d[5], rel: !!d[6], drop: !!d[7],
  chars: Array.from(d[1]), ph: hash(i, 3) * 6.283, pulses: [], weights: [], rejectT: null, on: true,
  x: 0, y: 0, w: 0, cx: [], size: 12, baseA: d[2] === 'hub' ? 0.92 : d[2] === 'fn' ? 0.42 : 0.62,
  tA: 0, tF: 0, cst: [], cdu: [],
}));

const assoc = nodes.filter(n => n.kind === 'a')
  .sort((a, b) => (a.ring + hash(a.i, 5) * 0.9) - (b.ring + hash(b.i, 5) * 0.9));
assoc.forEach((n, k) => {
  n.tA = T.assemble + k * 0.27;
  let mx = n.tA;
  n.chars.forEach((_, j) => {
    const s = n.tA + j * 0.06 + hash(n.i * 50 + j, 1) * 0.3, du = 1.0 + hash(n.i * 50 + j, 2) * 0.7;
    n.cst.push(s); n.cdu.push(du); mx = Math.max(mx, s + du);
  });
  n.tF = mx;
});
nodes.filter(n => n.kind !== 'a').forEach(n => { n.tA = T.glideEnd; n.tF = T.glideEnd; });

const edges = [], edgeMap = new Map();
function addEdge(a, b) {
  const k = a < b ? a + '|' + b : b + '|' + a;
  if (edgeMap.has(k)) return edgeMap.get(k);

  const hubs = A.kind !== 'a' && B.kind !== 'a';
  const e = {
    a: A, b: B, bend: (hash(i, 21) - .5) * 0.36, arrivals: [], rel: A.rel && B.rel,
    tA: hubs ? T.glideEnd + 0.1 + hash(i, 22) * 0.9 : Math.max(A.tF, B.tF) - 0.5 + hash(i, 22) * 0.5,
  };
  edges.push(e); edgeMap.set(k, e);
  return e;
}
EDGE_DEFS.forEach(([a, b]) => addEdge(a, b));

const hops = HOP_DEFS.map(([f, to, t0, du = 0.55]) => {
  const e = addEdge(f, to), n = byId[to], ar = t0 + du;
  e.arrivals.push(ar);
  n.pulses.push(ar);
  const v = REJECT[n.id] != null ? 0.02 + hash(n.i, 31) * 0.06
    : n.rel ? 0.58 + hash(Math.round(t0 * 100), 32) * 0.37
    : 0.11 + hash(n.i, 33) * 0.2;
  n.weights.push({ t: ar, v });
  return { from: byId[f], to: n, e, t0, dur: du };
}).sort((a, b) => a.t0 - b.t0);

byId.why.pulses.push(30.0); byId.sky.pulses.push(30.05); byId.blue.pulses.push(30.15);
Object.keys(REJECT).forEach(id => { byId[id].rejectT = REJECT[id]; });
nodes.filter(n => n.rel).forEach(n => n.pulses.push(T.consensus + hash(n.i, 41) * 0.35));

const ANS = ANS_DEFS.map(([txt, c, src, k = 0]) => ({ txt, c, src, k }));
{ let tt = T.answer;
  ANS.forEach((a, i) => {
    const punct = /^[.,]$/.test(a.txt);
    a.d = punct ? 0.42 : 0.88 + (hash(i, 51) - .5) * 0.24;
    a.t0 = tt; a.tc = tt + 0.62 * a.d; tt += a.d;
    if (a.txt === '.' && i < ANS.length - 1) tt += 0.35;
    a.blue = a.txt.trim() === 'blue';
    a.src.forEach(id => byId[id] && byId[id].pulses.push(a.t0 + 0.04));

const heads = [];
{ let tt = 25.5, k = 0;
  while (tt < 64) {

const cv = document.getElementById('c'), ctx = cv.getContext('2d');

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const n = Math.round(clamp(W * H / 3800, 120, 520));
  field = []; fieldB = [[], [], []];
  for (let i = 0; i < n; i++) {
    const b = hash(i, 9) < .55 ? 1 : hash(i, 10) < .6 ? 0 : 2;
    const g = { i, b, x: hash(i, 1), y: hash(i, 2), vx: (hash(i, 3) - .5) * 16, vy: (hash(i, 4) - .5) * 9 - 2.5,
      a: .05 + Math.pow(hash(i, 5), 1.6) * .32, ph: hash(i, 6), swap: 2.5 + hash(i, 7) * 9 };
    field.push(g); fieldB[b].push(g);
  }

  SF = clamp(PF * 0.58, 9, 13); SCW = SF * RATIO;
  NF = clamp(m * 0.021, 11, 16);
  FF = clamp(m * 0.019, 10, 15);
  AF = clamp(m * 0.026, 13, 20); ACW = AF * RATIO; LH = AF * 1.75;
  Y0 = H / 2;
  wakeLeft = W / 2 - 8 * CW / 2;
  qLeft = W / 2 - (2 + Q.length) * CW / 2;

  let tot = (QT.length - 1) * CW * 1.2;
  QT.forEach(k => { k.bw = (k.s.length + k.sp) * CW; tot += k.bw; });
  let x = W / 2 - tot / 2;
  QT.forEach(k => { k.bl = x; k.ll = x + k.sp * CW; k.bc = x + k.bw / 2; x += k.bw + CW * 1.2; });

  buildField();

  const narrow = W < 560, portrait = H > W * 1.1;
  nodes.forEach(n => {
    n.on = !(narrow && n.drop);
    n.size = n.kind === 'hub' ? NF * 1.3 : n.kind === 'fn' ? NF * .95 : NF;
    setFont(font(n.size));
    n.w = ctx.measureText(n.label).width;
    n.cx = n.chars.map((_, j) => ctx.measureText(n.chars.slice(0, j).join('')).width);
  });

  const gy0 = H * (portrait ? .07 : .09), gy1 = H * (portrait ? .58 : .62);
  const gw = Math.min(W - 32, H * 1.75, 1500), gx0 = W / 2 - gw / 2;
  act.forEach(n => { n.x = gx0 + n.w / 2 + n.nx * (gw - n.w); n.y = gy0 + n.ny * (gy1 - gy0); });
  const px = NF * 1.4, py = NF * 0.9;
  for (let it = 0; it < 140; it++) {
    for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      const A = act[i], B = act[j], dx = B.x - A.x, dy = B.y - A.y;
      const ox = (A.w + B.w) / 2 + px - Math.abs(dx), oy = (A.size + B.size) / 2 + py - Math.abs(dy);
      if (ox > 0 && oy > 0) {
        const wa = A.kind === 'hub' ? 0.2 : 1, wb = B.kind === 'hub' ? 0.2 : 1, s = wa + wb;
        if (ox * 0.6 < oy) { const sx = dx === 0 ? (i % 2 ? 1 : -1) : Math.sign(dx); A.x -= sx * ox * wa / s; B.x += sx * ox * wb / s; }
        else { const sy = dy === 0 ? 1 : Math.sign(dy); A.y -= sy * oy * wa / s; B.y += sy * oy * wb / s; }
      }
    }
    act.forEach(n => { n.x = clamp(n.x, 16 + n.w / 2, W - 16 - n.w / 2); n.y = clamp(n.y, gy0, gy1); });
  }

  const maxCols = Math.max(16, Math.floor(Math.min(W - 40, ACW * 64) / ACW));
  let line = 0, col = 0, used = 0;
  ansLay = ANS.map(a => {
    let txt = a.txt;
    if (col > 0 && col + txt.length > maxCols && !/^[.,]$/.test(txt)) { line++; col = 0; }
    if (col === 0 && txt[0] === ' ') txt = txt.slice(1);
    const L = { line, col, text: txt };
    col += txt.length; used = Math.max(used, col);
    return L;
  });
  ansLines = line + 1;
  ansLeft = W / 2 - used * ACW / 2;
  genTop = clamp(H * 0.75, gy1 + NF * 2.5, Math.max(gy1 + NF * 2.5, H - 20 - (ansLines - 1) * LH - 4 * SF * 1.8));
  finalTop = H / 2 - (ansLines + 3) * LH / 2 + 2 * LH;
}

/* ---------- geometry helpers ---------- */
function fieldPos(g, t) {
  const sp = RM ? 0.15 : 1, ww = W + 60, hh = H + 60;
  let x = (g.x * ww + g.vx * t * sp) % ww; if (x < 0) x += ww;
  let y = (g.y * hh + g.vy * t * sp) % hh; if (y < 0) y += hh;
  return [x - 30, y - 30];
}
const srcOf = (id, st) => fieldPos(field[Math.floor(hash(id, 4) * field.length)], st);
function fly(id, sx, sy, tx, ty, p) {
  if (RM) return [tx, ty];
  const e = eio(p), dx = tx - sx, dy = ty - sy, o = (hash(id, 11) - .5) * 0.7;
  const cx = (sx + tx) / 2 - dy * o, cy = (sy + ty) / 2 + dx * o, v = 1 - e;
  return [v * v * sx + 2 * v * e * cx + e * e * tx, v * v * sy + 2 * v * e * cy + e * e * ty];
}
function nodePos(n, t) {
  const k = RM ? 0 : 1;
  return [n.x + Math.sin(t * 0.37 + n.ph) * 3 * k, n.y + Math.cos(t * 0.29 + n.ph * 1.3) * 2.5 * k];
}
function trimR(n, ux, uy) { const a = n.w / 2 + 6, b = n.size * 0.9; return a * b / Math.sqrt((b * ux) ** 2 + (a * uy) ** 2); }
function edgeGeo(e, t) {
  const [ax, ay] = nodePos(e.a, t), [bx, by] = nodePos(e.b, t);
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, k = e.bend * L;
  return { ax, ay, bx, by, cx: (ax + bx) / 2 - uy * k, cy: (ay + by) / 2 + ux * k,
    u0: Math.min(.42, trimR(e.a, ux, uy) / L), u1: 1 - Math.min(.42, trimR(e.b, ux, uy) / L) };
}
function qpt(g, u) { const v = 1 - u; return [v * v * g.ax + 2 * v * u * g.cx + u * u * g.bx, v * v * g.ay + 2 * v * u * g.cy + u * u * g.by]; }
function strokeSeg(g, ua, ub) {
  const n = Math.max(2, Math.ceil(Math.abs(ub - ua) * 18));
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const [x, y] = qpt(g, ua + (ub - ua) * i / n); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
}

/* ---------- layers ---------- */
function drawField(t) {
  const env = kf(FIELD_KF, t);
  if (env < 0.003) return;
  ctx.fillStyle = INKc;
  const cxm = W / 2, cym = H / 2, big = Math.max(W, H);
  for (let b = 0; b < 3; b++) {
    setFont(font(FF * BS[b]));
    for (const g of fieldB[b]) {
      const [x, y] = fieldPos(g, t);
      let a = g.a * env * (0.7 + 0.3 * Math.sin(t * 0.6 + g.ph * 40));
      if (!RM) for (const r0 of RIPPLES) {
        const dt = t - r0;
        if (dt > 0 && dt < 3.6) { const z = (Math.hypot(x - cxm, y - cym) - dt * big * 0.42) / 48; a += Math.exp(-z * z) * (1 - dt / 3.6) * 0.6; }
      }
      if (a < 0.012) continue;
      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.fillText(glyphAt(hash(g.i * 7 + 1, Math.floor(t / g.swap + g.ph * 10))), x, y);
    }
  }
}

let fX = 0, fY = 0, fA = 0, lastFT = 0, headX = 0, headY = 0;
function drawFocus(t) {
  let tx = null, ty = null, ta = 0;
  if (t >= T.attend - 0.2 && t < T.answer) {
    let h = null;
    for (const x of hops) { if (x.t0 > t) break; if (x.from.on && x.to.on) h = x; }
    if (h) {
      const end = h.t0 + h.dur;
      if (t < end) {
        const g = edgeGeo(h.e, t), fw = h.e.a === h.from, q = eio(prog(t, h.t0, end));
        [tx, ty] = qpt(g, fw ? lerp(g.u0, g.u1, q) : lerp(g.u1, g.u0, q));
      } else [tx, ty] = nodePos(h.to, t);
      ta = 1 - prog(t, end + 1.0, end + 2.5);
    }
  } else if (t >= T.answer && t < GEN_END + 0.6) { tx = headX; ty = headY; ta = 0.7; }
  const dt = Math.min(0.1, Math.abs(t - lastFT)); lastFT = t;
  const k = 1 - Math.exp(-dt * 4);
  if (tx !== null) { if (fA < 0.01) { fX = tx; fY = ty; } fX += (tx - fX) * k; fY += (ty - fY) * k; }
  fA += (ta - fA) * k;
  if (fA < 0.01) return;
  const r = Math.min(W, H) * 0.28;
  const gr = ctx.createRadialGradient(fX, fY, 0, fX, fY, r);
  gr.addColorStop(0, sig(0.075 * fA)); gr.addColorStop(1, sig(0));
  ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(fX - r, fY - r, 2 * r, 2 * r);
}

function drawPrompt(t) {
  if (t < T.promptOn || t >= T.glideEnd) return;
  const y = Y0, on = prog(t, T.promptOn, T.promptOn + 0.25);
  setFont(font(PF)); ctx.textAlign = 'left';

  // the prompt mark
  const gx = t < 9.0 ? wakeLeft : lerp(wakeLeft, qLeft, eio(prog(t, 9.0, 9.8)));
  const ga = on * (1 - prog(t, T.tokenize, T.tokenize + 0.6));
  if (ga > 0) { ctx.fillStyle = INKc; ctx.globalAlpha = 0.55 * ga; ctx.fillText('>', gx, y); }

  // "wake"
  for (let i = 0; i < 4; i++) {
    if (t < WAKEKEYS[i]) break;
    let x = wakeLeft + (2 + i) * CW, yy = y, g = 'wake'[i], al = 0.95;
    if (t >= T.wakeGo) {
      const id = 300 + i, st = T.wakeGo + i * 0.09, p = prog(t, st, st + 1.4);
      if (p >= 1) continue;
      const e = eo(p);
      if (!RM) { x += (hash(id, 1) - .5) * 140 * e; yy -= (30 + hash(id, 2) * 110) * e; }
      if (p > 0.08) g = scr(id, t, 14);
      al = 0.95 * (1 - p);
    }
    ctx.fillStyle = INKc; ctx.globalAlpha = al; ctx.fillText(g, x, yy);
  }

  // cursor
  let cx = null, last = -9;
  if (t < T.wakeGo) {
    let n = 0; for (const k of WAKEKEYS) if (t >= k) { n++; last = k; }
    if (t >= WAKESPACE) last = WAKESPACE;
    cx = wakeLeft + (2 + n + (t >= WAKESPACE ? 1 : 0)) * CW;
  } else if (t < QKEYS[0]) {
    cx = lerp(wakeLeft + 7 * CW, qLeft + 2 * CW, eio(prog(t, 8.3, 9.8)));
    last = T.wakeGo;
  } else if (t < T.enter) {
    let n = 0; for (const k of QKEYS) if (t >= k) { n++; last = k; }
    cx = qLeft + (2 + n) * CW;
  }
  if (cx !== null && ((t - last) < 0.5 || Math.floor((t - last) * 1.7) % 2 === 0)) {
    ctx.fillStyle = SIGc; ctx.globalAlpha = 0.95 * on; ctx.fillText('_', cx, y);
  }

  // the question, typed
  if (t < T.tokenize) {
    ctx.fillStyle = INKc;
    for (let i = 0; i < Q.length; i++) {
      if (t < QKEYS[i]) break;
      if (Q[i] === ' ') continue;
      ctx.globalAlpha = 0.5 + 0.45 * prog(t, QKEYS[i], QKEYS[i] + 0.08);
      ctx.fillText(Q[i], qLeft + (2 + i) * CW, y);
    }
    return;
  }

  // brackets + token ids
  const ba = prog(t, T.ids, T.ids + 0.5) * (1 - prog(t, T.absorb, T.absorb + 0.5));
  if (ba > 0) {
    ctx.strokeStyle = INKc; ctx.lineWidth = 1; ctx.globalAlpha = 0.32 * ba;
    const yb = y + PF * 0.75;
    QT.forEach(k => {
      ctx.beginPath();
      ctx.moveTo(k.bl + 1, yb - 4); ctx.lineTo(k.bl + 1, yb); ctx.lineTo(k.bl + k.bw - 1, yb); ctx.lineTo(k.bl + k.bw - 1, yb - 4);
      ctx.stroke();
    });
    setFont(font(SF)); ctx.textAlign = 'center'; ctx.fillStyle = INKc; ctx.globalAlpha = 0.5 * ba;
    QT.forEach(k => ctx.fillText(String(k.id), k.bc, y + PF * 1.35));
    ctx.textAlign = 'left';
  }

  // embeddings: glyphs gather into vectors, get rewritten, then sink into their tokens
  if (t >= T.embed && t < T.absorb + 1.2) {
    setFont(font(SF)); ctx.fillStyle = INKc;
    QT.forEach((k, ki) => {
      for (let r = 0; r < 5; r++) {
        const step = t < T.embed + 1.5 ? 0 : t < T.embed + 2.8 ? 1 + Math.floor((t - T.embed - 1.5) / 0.13) : 99;
        const v = hash(ki * 16 + r, step) * 1.9 - 0.95;
        const str = (v < 0 ? '-' : '+') + Math.abs(v).toFixed(2);
        const rowY = y + PF * 1.35 + SF * 1.55 * (r + 1);
        const colL = k.bc - 5 * SCW / 2;
        const ab = eio(prog(t, T.absorb + r * 0.06, T.absorb + 0.7 + r * 0.06));
        for (let c = 0; c < 5; c++) {
          const id = 5000 + ki * 100 + r * 10 + c;
          const st = T.embed + ki * 0.07 + r * 0.09 + c * 0.03 + hash(id, 1) * 0.15, du = 0.8 + hash(id, 2) * 0.35;
          if (t < st) continue;
          const p = prog(t, st, st + du);
          let x = colL + c * SCW, yy = lerp(rowY, y, ab), g = str[c], al = 0.55 * (1 - ab);
          if (p < 1) {
            const [sx, sy] = srcOf(id, st);
            [x, yy] = fly(id, sx, sy, x, yy, p);
            if (p < 0.8) g = scr(id, t);
            al = lerp(0.2, 0.55, eo(p));
          }
          if (al < 0.01) continue;
          ctx.globalAlpha = al; ctx.fillText(g, x, yy);
        }
      }
    });
  }

  // tokens: split apart, absorb meaning, then drift into the graph
  const s = eio(prog(t, T.tokenize, T.tokenize + 0.9));
  const flash = Math.exp(-Math.pow((t - (T.absorb + 0.85)) / 0.35, 2));
  QT.forEach((k, ki) => {
    const n = byId[k.node];
    let lx = lerp(qLeft + (2 + k.idx) * CW, k.ll, s), ly = y, size = PF, al = 0.95;
    if (t >= T.glide) {
      const gp = eio(prog(t, T.glide + ki * 0.12, T.glideEnd - 0.6 + ki * 0.12));
      const [nx, ny] = nodePos(n, t);
      size = lerp(PF, n.size, gp);
      setFont(font(size));
      const w = ctx.measureText(k.s).width;
      lx = lerp(k.ll + k.s.length * CW / 2, nx, gp) - w / 2;
      ly = lerp(y, ny, gp);
      al = lerp(0.95, n.baseA, gp);
    }
    setFont(font(size));
    ctx.fillStyle = flash > 0.02 ? mix(flash) : INKc;
    ctx.globalAlpha = Math.max(al, flash);
    ctx.fillText(k.s, lx, ly);
    if (k.sp) {
      const da = 0.38 * prog(t, T.tokenize + 0.4, T.tokenize + 0.9) * (1 - prog(t, T.glide, T.glide + 0.3));
      if (da > 0) { setFont(font(PF)); ctx.fillStyle = INKc; ctx.globalAlpha = da; ctx.fillText('·', lx - CW, ly); }
    }
  });
}

function nodeAlpha(n, t) {
  let a = n.baseA;
  if (n.rejectT != null) a *= 1 - 0.8 * eo(prog(t, n.rejectT + 0.25, n.rejectT + 1.6));
  else if (!n.rel) a *= 1 - 0.7 * prog(t, T.consensus, T.consensus + 1.4);
  return a * (1 - 0.35 * prog(t, T.answer - 0.5, T.answer + 0.8));
}
function nodePulse(n, t) {
  let p = 0;
  for (const tp of n.pulses) {
    if (t >= tp) p += Math.exp(-(t - tp) / 0.9);
    else if (tp - t < 0.15) p += (0.15 - (tp - t)) / 0.15 * 0.3;
  }
  return Math.min(1, p);
}

function drawNode(n, t) {
  if (!n.on || t < n.tA) return;
  const [x, y] = nodePos(n, t);
  const a = nodeAlpha(n, t), pu = t < T.dissolve ? nodePulse(n, t) : 0;
  const left = x - n.w / 2;
  if (pu > 0.04) {
    const r = n.w * 0.5 + n.size * 1.6;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, sig(0.16 * pu)); gr.addColorStop(1, sig(0));
    ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const col = pu > 0.02 ? mix(pu) : INKc;
  const A = Math.min(1, Math.max(a, pu * 0.95));
  setFont(font(n.size));
  const assembling = n.kind === 'a' && t < n.tF, dissolving = t >= T.dissolve;
  if (!assembling && !dissolving) {
    ctx.fillStyle = col; ctx.globalAlpha = A; ctx.fillText(n.label, left, y);
  } else {
    for (let j = 0; j < n.chars.length; j++) {
      const ch = n.chars[j];
      if (ch === ' ') continue;
      const id = n.i * 131 + j;
      let px = left + n.cx[j], py = y, g = ch, al = A, c = col;
      if (assembling) {
        const st = n.cst[j], du = n.cdu[j];
        if (t < st) continue;
        const p = prog(t, st, st + du);
        if (p < 1) {
          const [sx, sy] = srcOf(id, st);
          [px, py] = fly(id, sx, sy, px, py, p);
          if (p < 0.8) g = scr(id, t);
          al = lerp(0.2, A, eo(p)); c = INKc;
        }
      } else {
        const st = T.dissolve + hash(id, 5) * 1.5, p = prog(t, st, st + 1.3 + hash(id, 6) * 1.1);
        if (p >= 1) continue;
        if (p > 0) {
          const e = eo(p), ang = hash(id, 7) * 6.283, dist = RM ? 0 : (40 + hash(id, 8) * 160) * e;
          px += Math.cos(ang) * dist; py += Math.sin(ang) * dist - (RM ? 0 : 20 * p);
          if (p > 0.15) g = scr(id, t, 10);
          al = A * (1 - p);
        }
      }
      ctx.fillStyle = c; ctx.globalAlpha = al; ctx.fillText(g, px, py);
    }
  }
  if (n.rejectT != null && t > n.rejectT && t < T.dissolve) {
    const sp = eo(prog(t, n.rejectT, n.rejectT + 0.35));
    ctx.strokeStyle = INKc; ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5 * (1 - 0.6 * prog(t, n.rejectT + 0.4, n.rejectT + 2));
    ctx.beginPath(); ctx.moveTo(left - 3, y); ctx.lineTo(left - 3 + (n.w + 6) * sp, y); ctx.stroke();
  }
  for (const wt of n.weights) {
    if (t < wt.t || t > wt.t + 1.6) continue;
    setFont(font(SF)); ctx.fillStyle = SIGc;
    ctx.globalAlpha = 0.9 * (1 - prog(t, wt.t + 0.4, wt.t + 1.6));
    ctx.fillText(wt.v.toFixed(2), x + n.w / 2 + 4, y - n.size * 0.8);
  }
}

function drawTraveler(e, fw, p, t, alpha, r, trail) {
  const g = edgeGeo(e, t), q = eio(p);
  const U = u => fw ? lerp(g.u0, g.u1, u) : lerp(g.u1, g.u0, u);
  const fade = alpha * Math.min(1, p * 6, (1 - p) * 6);
  ctx.strokeStyle = SIGc; ctx.lineWidth = r > 2 ? 1.4 : 1; ctx.globalAlpha = fade * 0.8;
  strokeSeg(g, U(Math.max(0, q - trail)), U(q));
  const [x, y] = qpt(g, U(q));
  ctx.fillStyle = SIGc; ctx.globalAlpha = fade;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.lineWidth = 1;
}

function drawGraph(t) {
  const gF = 1 - prog(t, T.dissolve, T.dissolve + 1.2);
  ctx.lineWidth = 1;
  if (gF > 0) for (const e of edges) {
    if (!e.a.on || !e.b.on) continue;
    const grow = eo(prog(t, e.tA, e.tA + 0.8));
    if (grow <= 0) continue;
    const g = edgeGeo(e, t);
    let base = 0.11;
    if (t > T.consensus) base = lerp(0.11, e.rel ? 0.13 : 0.035, prog(t, T.consensus, T.consensus + 1.4));
    base *= (1 - 0.4 * prog(t, T.answer - .5, T.answer + .8)) * gF;
    ctx.strokeStyle = INKc; ctx.globalAlpha = base;
    strokeSeg(g, g.u0, lerp(g.u0, g.u1, grow));
    let lit = 0;
    for (const ta of e.arrivals) if (t >= ta) lit += 0.5 * Math.exp(-(t - ta) / 1.8);
    if (e.rel) lit += 0.13 * prog(t, T.consensus, T.consensus + 1) * (1 - 0.6 * prog(t, T.answer - .5, T.answer + .8));
    lit = Math.min(0.7, lit) * gF;
    if (lit > 0.01 && grow >= 1) { ctx.strokeStyle = SIGc; ctx.globalAlpha = lit; strokeSeg(g, g.u0, g.u1); }
  }
  if (t > 25 && t < 65.5) for (const h of heads) {
    if (t < h.t0 || t > h.t0 + h.dur) continue;
    const e = h.e;
    if (!e.a.on || !e.b.on || h.t0 < e.tA + 0.8) continue;
    drawTraveler(e, h.fw, prog(t, h.t0, h.t0 + h.dur), t, 0.32, 1.3, 0.16);
  }
  for (const h of hops) {
    if (t < h.t0 || t > h.t0 + h.dur || !h.from.on || !h.to.on) continue;
    drawTraveler(h.e, h.e.a === h.from, prog(t, h.t0, h.t0 + h.dur), t, 0.9, 2.2, 0.24);
  }
  for (const n of nodes) drawNode(n, t);
}

function drawBeams(a, tx, ty, t) {
  const g = eo(prog(t, a.t0, a.t0 + 0.4 * a.d)), f = 1 - prog(t, a.tc, a.tc + 0.45);
  if (g <= 0 || f <= 0) return;
  ctx.lineWidth = 1;
  for (const id of a.src) {
    const n = byId[id];
    if (!n || !n.on) continue;
    const [nx, ny] = nodePos(n, t);
    const gr = ctx.createLinearGradient(nx, ny, tx, ty);
    gr.addColorStop(0, sig(0.06)); gr.addColorStop(1, sig(0.55));
    ctx.strokeStyle = gr; ctx.globalAlpha = f;
    ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(lerp(nx, tx, g), lerp(ny, ty, g)); ctx.stroke();
    const u = eio(prog(t, a.t0 + 0.05, a.t0 + 0.55 * a.d));
    if (u > 0 && u < 1) {
      ctx.fillStyle = SIGc; ctx.globalAlpha = 0.9 * f;
      ctx.beginPath(); ctx.arc(lerp(nx, tx, u), lerp(ny, ty, u), 1.8, 0, 6.283); ctx.fill();
    }
  }
}

function drawCands(a, x, hy, t) {
  const vis = prog(t, a.t0 + 0.1 * a.d, a.t0 + 0.3 * a.d) * (1 - prog(t, a.tc, a.tc + 0.3));
  if (vis <= 0) return;
  const rows = [];
  for (let k = 0; k < a.c.length; k += 2) rows.push([a.c[k], a.c[k + 1]]);
  const labels = rows.map(r => (r[0][0] === ' ' ? '·' : '') + r[0].trim());
  const maxL = Math.max(...labels.map(s => s.length));
  const barMax = SCW * 8, boxW = (maxL + 1) * SCW + barMax + SCW * 5.5, rh = SF * 1.8;
  const bx = Math.max(16, Math.min(x, W - 16 - boxW)), y0 = hy + LH * 0.95;
  ctx.globalAlpha = 0.86 * vis; ctx.fillStyle = VOID;
  ctx.fillRect(bx - 8, y0 - rh * 0.6, boxW + 16, rows.length * rh + rh * 0.2);
  const sel = prog(t, a.tc - 0.18 * a.d, a.tc - 0.05 * a.d);
  setFont(font(SF));
  rows.forEach((r, k) => {
    const ry = y0 + k * rh;
    const ra = vis * prog(t, a.t0 + 0.12 * a.d + k * 0.06, a.t0 + 0.3 * a.d + k * 0.06);
    const chosen = k === a.k, dim = chosen ? 1 : 1 - 0.6 * sel;
    ctx.fillStyle = INKc; ctx.globalAlpha = ra * (chosen ? 0.9 : 0.42) * dim;
    ctx.fillText(labels[k], bx, ry);
    const bw = barMax * r[1] * eo(prog(t, a.t0 + 0.15 * a.d, a.t0 + 0.45 * a.d));
    ctx.fillStyle = chosen && sel > 0 ? mix(sel) : INKc;
    ctx.globalAlpha = ra * (chosen ? 0.45 + 0.55 * sel : 0.28) * dim;
    ctx.fillRect(bx + (maxL + 1) * SCW, ry - 1, Math.max(1, bw), 2);
    ctx.fillStyle = INKc; ctx.globalAlpha = ra * 0.5 * dim;
    ctx.fillText(r[1].toFixed(2), bx + (maxL + 1) * SCW + barMax + SCW, ry);
  });
}

function forgetChar(id, t) {
  if (t < T.forget) return 0;
  const tf = T.forget + hash(id, 3) * 2.4;
  return prog(t, tf, tf + 1.0);
}

function drawAnswer(t) {
  const off = (finalTop - genTop) * eio(prog(t, T.settle, T.settle + 1.8));
  let curX = ansLeft, curY = genTop + off, lastEvt = T.answer - 0.6, pending = null;
  setFont(font(AF));
  for (let i = 0; i < ANS.length; i++) {
    const a = ANS[i], L = ansLay[i];
    if (t < a.t0) break;
    const txt = L.text, lead = txt[0] === ' ' ? 1 : 0;
    const hx = ansLeft + L.col * ACW, hy = genTop + L.line * LH + off;
    const wordX = hx + lead * ACW, wordW = (txt.length - lead) * ACW;
    if (t < a.tc + 0.45) drawBeams(a, wordX + wordW / 2, hy - AF * 0.55, t);
    if (t < a.tc) {
      curX = wordX; curY = hy; lastEvt = a.t0;
      if (a.c) pending = [a, wordX, hy];
      continue;
    }
    setFont(font(AF));
    for (let c = lead; c < txt.length; c++) {
      const id = 9000 + i * 40 + c, rk = a.tc + (c - lead) * 0.028 + 0.08;
      let g = t < rk ? scr(id, t, 22) : txt[c], al = t < rk ? 0.55 : 0.93, yy = hy;
      const fp = forgetChar(id, t);
      if (fp > 0) { al *= 1 - fp; yy -= 6 * fp; if (fp > 0.08) g = scr(id, t, 9); }
      if (al < 0.01) continue;
      ctx.fillStyle = a.blue ? SIGc : INKc; ctx.globalAlpha = al;
      ctx.fillText(g, hx + c * ACW, yy);
    }
    curX = hx + txt.length * ACW; curY = hy; lastEvt = a.tc;
  }
  headX = curX + ACW / 2; headY = curY;
  if (pending) drawCands(pending[0], pending[1], pending[2], t);
  if (t >= T.answer - 0.6 && t < GEN_END + 0.9) {
    const on = (t - lastEvt) < 0.35 || Math.floor(t * 2) % 2 === 0;
    if (on) {
      setFont(font(AF)); ctx.fillStyle = SIGc;
      ctx.globalAlpha = 0.95 * prog(t, T.answer - 0.6, T.answer - 0.3) * (1 - prog(t, GEN_END + 0.6, GEN_END + 0.9));
      ctx.fillText('_', curX, curY);
    }
  }
}

function drawEnd(t) {
  if (t < T.settle + 1.0) return;
  setFont(font(AF));
  const qs = '> ' + Q, qy = finalTop - 2 * LH;
  for (let k = 0; k < qs.length; k++) {
    const ch = qs[k];
    if (ch === ' ') continue;
    const id = 7000 + k, st = T.settle + 1.0 + k * 0.03;
    if (t < st) continue;
    let g = t < st + 0.12 ? scr(id, t, 22) : ch, al = (k === 0 ? 0.3 : 0.42) * prog(t, st, st + 0.12), yy = qy;
    const fp = forgetChar(id, t);
    if (fp > 0) { al *= 1 - fp; yy -= 6 * fp; if (fp > 0.08) g = scr(id, t, 9); }
    if (al < 0.01) continue;
    ctx.fillStyle = INKc; ctx.globalAlpha = al; ctx.fillText(g, ansLeft + k * ACW, yy);
  }
  const ps = T.settle + 2.0;
  if (t < ps) return;
  const hp = eio(prog(t, T.home, T.home + 1.4));
  const size = lerp(AF, PF, hp), cw = size * RATIO;
  const x0 = lerp(ansLeft, wakeLeft, hp), y = lerp(finalTop + (ansLines + 1) * LH, Y0, hp);
  const ap = prog(t, ps, ps + 0.3);
  setFont(font(size));
  ctx.fillStyle = INKc; ctx.globalAlpha = 0.55 * ap; ctx.fillText('>', x0, y);
  if (Math.floor((t - ps) * 1.7) % 2 === 0) { ctx.fillStyle = SIGc; ctx.globalAlpha = 0.95 * ap; ctx.fillText('_', x0 + 2 * cw, y); }
}

function draw(t) {
  ctx.globalAlpha = 1; ctx.fillStyle = VOID; ctx.fillRect(0, 0, W, H);
  drawField(t);
  drawFocus(t);
  if (t >= T.glideEnd - 0.5 && t < T.dissolve + 3.6) drawGraph(t);
  drawPrompt(t);
  if (t >= T.answer - 0.8) drawAnswer(t);
  drawEnd(t);
  ctx.globalAlpha = 1;
}

/* ---------- clock + transport ---------- */
let playing = true, tBase = 0, wall0 = performance.now(), wasPlaying = true;
const now = () => playing ? tBase + (performance.now() - wall0) / 1000 : tBase;
function seek(t) { tBase = Math.max(0, t); wall0 = performance.now(); }
function setPlaying(p) { if (p === playing) return; tBase = now(); wall0 = performance.now(); playing = p; }

const bar = document.getElementById('bar'), btn = document.getElementById('play');
const track = document.getElementById('track'), fill = document.getElementById('fill'), timeEl = document.getElementById('time');
let hideTimer = 0;
function poke() {
  bar.classList.add('on');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (!bar.matches(':hover')) bar.classList.remove('on'); }, 2400);
}
addEventListener('pointermove', poke);
addEventListener('pointerdown', poke);
btn.addEventListener('click', () => {
  if (now() >= DUR) { seek(0); setPlaying(true); } else setPlaying(!playing);
  poke();
});
function seekFromX(x) { const r = track.getBoundingClientRect(); seek(clamp((x - r.left) / r.width, 0, 1) * DUR); }
track.addEventListener('pointerdown', e => { track.setPointerCapture(e.pointerId); seekFromX(e.clientX); });
track.addEventListener('pointermove', e => { if (track.hasPointerCapture(e.pointerId)) seekFromX(e.clientX); });
addEventListener('keydown', e => {
  if (e.key === ' ' && e.target !== btn) { e.preventDefault(); btn.click(); }
  else if (e.key === 'r' || e.key === 'R') { seek(0); setPlaying(true); poke(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(Math.min(now(), DUR) - 5); poke(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seek(Math.min(now() + 5, DUR)); poke(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { wasPlaying = playing; setPlaying(false); }
  else if (wasPlaying) setPlaying(true);
});

const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let lastLabel = '', lastSec = -1;
function ui(t) {
  const tc = Math.min(t, DUR);
  fill.style.width = (tc / DUR * 100) + '%';
  const s = Math.floor(tc);
  if (s !== lastSec) { lastSec = s; timeEl.textContent = fmt(s) + ' / ' + fmt(DUR); track.setAttribute('aria-valuenow', String(s)); }
  const lab = t >= DUR ? 'replay' : playing ? 'pause' : 'play';
  if (lab !== lastLabel) { lastLabel = lab; btn.textContent = lab; }
}

function frame() { const t = now(); draw(t); ui(t); requestAnimationFrame(frame); }

window.claude?.hot?.snapshot?.(() => ({ t: now(), playing }));
function start(data) {
  data = data || {};
  if (typeof data.t === 'number' && isFinite(data.t)) seek(data.t);
  if (data.playing === false) setPlaying(false);
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
